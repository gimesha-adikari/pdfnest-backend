name: Backend CI & Container Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Quality Gates & External Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          check-latest: true

      - name: Install Native OS Dependencies for Tests
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils postgresql redis-server tesseract-ocr qpdf

      - name: Verify Go Backend Compilation
        run: go build ./...

      - name: Verify preview scale safety
        run: go test ./internal/conversion -run 'Preview|PageToImage' -count=1

      - name: Verify Studio preview authenticated-body boundary
        env:
          APP_ENV: test
          STORAGE_MODE: local
        run: go test -race ./internal/studio -run '^TestStudioPreviewBodyLimit' -count=1 -timeout=90s

      - name: Verify Studio PDF source admission
        env:
          APP_ENV: test
          STORAGE_MODE: local
          GOMAXPROCS: '2'
        run: go test -race ./internal/storage ./internal/studio -run '^(TestStudioSourceAdmission|TestStudioPDF|TestStudioPresign)' -count=1 -timeout=180s

      - name: Verify Worker body signing and transport safety
        run: go test -race ./internal/worker ./internal/ocr ./internal/ocrv2 ./internal/analyzer/engine/ast -count=1 -timeout=120s

      - name: Verify offline Markdown and Code PDF safety
        env:
          APP_ENV: test
          STORAGE_MODE: local
          GOMAXPROCS: '2'
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable
          go test ./internal/conversion -run '^(TestMarkdown|TestCode)' -count=1 -p 1 -parallel 1 -timeout 5m

      - name: Verify account security and Studio retention with isolated native PostgreSQL
        run: scripts/test-account-security.sh

      - name: Setup Python for pinned Worker compatibility
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare exact reviewed Worker compatibility source
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/backend-worker-compat-venv
          UV_CONCURRENT_DOWNLOADS: '1'
          UV_CONCURRENT_BUILDS: '1'
          UV_CONCURRENT_INSTALLS: '1'
        run: |
          git init "$RUNNER_TEMP/backend-worker-compat"
          git -C "$RUNNER_TEMP/backend-worker-compat" remote add origin https://github.com/gimesha-adikari/pdfnest-worker.git
          git -C "$RUNNER_TEMP/backend-worker-compat" fetch --depth 1 origin 8595d73f8c39865f35acd6259b91ed897fc07f7c
          git -C "$RUNNER_TEMP/backend-worker-compat" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/backend-worker-compat" rev-parse HEAD)" = 8595d73f8c39865f35acd6259b91ed897fc07f7c
          # The old-receiver fixture reads this exact historical module via git
          # show; retain it without changing the reviewed current checkout.
          git -C "$RUNNER_TEMP/backend-worker-compat" fetch --depth 1 origin 18c96a36271c0f6269d33ca5aac6e82e4ab964cc
          git -C "$RUNNER_TEMP/backend-worker-compat" cat-file -e 18c96a36271c0f6269d33ca5aac6e82e4ab964cc:app/core/security.py
          python -m pip install --no-cache-dir uv==0.11.28
          uv sync --project "$RUNNER_TEMP/backend-worker-compat" --frozen --no-install-project
          uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"
          echo "F15_WORKER_ROOT=$RUNNER_TEMP/backend-worker-compat" >> "$GITHUB_ENV"
          echo "F15_PYTHON=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"

      - name: Prepare Worker PR #13 candidate source for live isolation test
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/backend-worker-pr13-venv
          UV_CONCURRENT_DOWNLOADS: '1'
          UV_CONCURRENT_BUILDS: '1'
          UV_CONCURRENT_INSTALLS: '1'
        run: |
          git init "$RUNNER_TEMP/backend-worker-pr13"
          git -C "$RUNNER_TEMP/backend-worker-pr13" remote add origin https://github.com/gimesha-adikari/pdfnest-worker.git
          git -C "$RUNNER_TEMP/backend-worker-pr13" fetch --depth 1 origin 18851c77fa9cd400096656f65495c58844f5a448
          git -C "$RUNNER_TEMP/backend-worker-pr13" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/backend-worker-pr13" rev-parse HEAD)" = 18851c77fa9cd400096656f65495c58844f5a448
          uv sync --project "$RUNNER_TEMP/backend-worker-pr13" --frozen --no-install-project
          uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"
          echo "WORKER_PR13_ROOT=$RUNNER_TEMP/backend-worker-pr13" >> "$GITHUB_ENV"
          echo "WORKER_PR13_PYTHON=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          echo "WORKER_PR13_REVISION=18851c77fa9cd400096656f65495c58844f5a448" >> "$GITHUB_ENV"

      - name: Fetch historical Backend baseline for durability rollback compatibility
        run: |
          git fetch --depth 1 origin 40dfe66886e7c7c5bc3f522e4ca5fcd55e669a02
          git cat-file -e 40dfe66886e7c7c5bc3f522e4ca5fcd55e669a02

      - name: Verify backend durability with isolated PostgreSQL and Redis
        run: scripts/test-backend-durability.sh

      - name: Verify Analyzer public failure boundaries
        run: scripts/test-analyzer-public-errors.sh

      - name: Verify repository acquisition security
        run: go test -race ./internal/analyzer/engine/acquisition ./internal/analyzer/engine/exclusion ./internal/netguard -count=1 -timeout=90s

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & OCI Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pdfnest-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
