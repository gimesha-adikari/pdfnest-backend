name: Backend CI & Container Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Quality Gates & External Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          check-latest: true

      - name: Install Native OS Dependencies for Tests
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils postgresql

      - name: Verify Go Backend Compilation
        run: go build ./...

      - name: Verify preview scale safety
        run: go test ./internal/conversion -run 'Preview|PageToImage' -count=1

      - name: Verify Worker body signing and transport safety
        run: go test -race ./internal/worker ./internal/ocr ./internal/ocrv2 ./internal/analyzer/engine/ast -count=1 -timeout=120s

      - name: Verify offline Markdown and Code PDF safety
        env:
          APP_ENV: test
          STORAGE_MODE: local
          GOMAXPROCS: '2'
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable
          go test ./internal/conversion -run '^(TestMarkdown|TestCode)' -count=1 -p 1 -parallel 1 -timeout 5m

      - name: Verify account security with isolated native PostgreSQL
        run: scripts/test-account-security.sh

      - name: Verify repository acquisition security
        run: go test -race ./internal/analyzer/engine/acquisition ./internal/analyzer/engine/exclusion ./internal/netguard -count=1 -timeout=90s

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & OCI Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pdfnest-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
