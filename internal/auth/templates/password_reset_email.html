<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Platen PDF password</title>
</head>
<body style="margin:0;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif;line-height:1.5;">
    <div style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;">
        <h1 style="margin:0 0 16px;font-size:24px;">Reset your Platen PDF password</h1>
        <p>We received a request to reset the password for your account.</p>
        <p style="margin:24px 0;">
            <a href="{{.ResetURL}}" style="display:inline-block;padding:12px 20px;background:#4f46e5;color:#ffffff;text-decoration:none;border-radius:10px;font-weight:700;">Choose a new password</a>
        </p>
        <p style="font-size:14px;color:#475569;">This link expires in {{.Expiry}} and can be used only once.</p>
        <p style="font-size:14px;color:#475569;">If you did not request this change, you can safely ignore this email.</p>
        <p style="font-size:14px;color:#475569;">Need help? <a href="{{.ContactURL}}">Contact Platen PDF support</a>.</p>
    </div>
</body>
</html>
